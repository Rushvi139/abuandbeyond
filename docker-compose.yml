# Abu & Beyond — its own Compose project next to your other apps.
#
#   docker compose up -d --build          app + database + nightly backups
#   docker compose run --rm migrate       apply DB migrations and load the menu (first deploy, after updates)
#
# Shared server: add COMPOSE_FILE=docker-compose.yml:docker-compose.traefik.yml to .env
# Empty server:  docker compose --profile caddy up -d --build   (bundled HTTPS)
name: abuandbeyond

x-db-url: &db-url postgres://${POSTGRES_USER:-abu}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-abuandbeyond}

services:
  app:
    container_name: abuandbeyond-app
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    env_file: .env
    environment:
      DATABASE_URL: *db-url
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"

  db:
    container_name: abuandbeyond-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abuandbeyond}
      POSTGRES_USER: ${POSTGRES_USER:-abu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Asia/Kolkata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"   # only from the server itself (psql, backups, SSH tunnel)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abu} -d ${POSTGRES_DB:-abuandbeyond}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backup:
    container_name: abuandbeyond-backup
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-abu}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-abuandbeyond}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Kolkata
    volumes:
      - ./backups:/backups
      # Bill invoices and expense slips live in this volume, not in Postgres.
      # A database-only backup would restore the books with every receipt gone.
      - uploads:/uploads:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          stamp=$$(date +%Y-%m-%d_%H%M)
          pg_dump --no-owner | gzip > /backups/abuandbeyond-$$stamp.sql.gz \
            && echo "db backup ok $$stamp"
          tar czf /backups/abuandbeyond-uploads-$$stamp.tar.gz -C /uploads . \
            && echo "uploads backup ok $$stamp"
          find /backups -name 'abuandbeyond-*' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done

  migrate:
    profiles: ["tools"]
    build:
      context: .
      target: tools
    env_file: .env
    environment:
      DATABASE_URL: *db-url
    # The migrations and seed are read from the checkout at run time, not baked
    # into the image. `compose up --build` skips profiled services, so a stale
    # tools image would otherwise keep reporting "migrations up to date" while
    # silently running an old set of files.
    volumes:
      - ./db:/app/db:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed"]

  caddy:
    profiles: ["caddy"]
    container_name: abuandbeyond-caddy
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Every couple of minutes, ask Cashfree about any order still sitting
  # unpaid. The webhook and the return-path check both miss sometimes — a
  # guest who pays and closes the tab, a webhook that never arrives — and
  # without this the money is taken while the kitchen never sees the order.
  reconcile:
    image: curlimages/curl:8.11.1
    depends_on:
      - app
    environment:
      SECRET: ${INTERNAL_SECRET:-}
      FALLBACK: ${SESSION_SECRET:?set SESSION_SECRET in .env}
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - |
        KEY="$${SECRET:-$$FALLBACK}"
        sleep 30
        while true; do
          curl -fsS -X POST http://app:3000/api/payments/reconcile \
            -H "x-internal-secret: $$KEY" > /dev/null \
            || echo "reconcile call failed"
          sleep 120
        done

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
