# Nginx site for Abu & Beyond on a shared server.
# Copy to /etc/nginx/sites-available/abuandbeyond.in, link into sites-enabled,
# then run: sudo nginx -t && sudo systemctl reload nginx
# Then get HTTPS: sudo certbot --nginx -d abuandbeyond.in -d www.abuandbeyond.in

server {
    listen 80;
    server_name www.abuandbeyond.in;
    return 301 https://abuandbeyond.in$request_uri;
}

server {
    listen 80;
    server_name abuandbeyond.in;

    client_max_body_size 60m;   # review uploads: 1 video up to 50 MB

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
